<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizon - Планувальник</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Added Google Fonts link for Nunito -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h1>HORIZON</h1>
        <div id="userInfo">
            <span id="userName">Ім'я Користувача</span>
            <button onclick="logout()">Вихід</button>
        </div>
    </header>

    <main class="dashboard">
        <aside class="sidebar">
            <h3>Категорії</h3>
            <ul id="categoryList">
                <li><span class="dot" style="background:#FF5733"></span> Робота</li>
                <li><span class="dot" style="background:#33FF57"></span> Навчання</li>
            </ul>
        </aside>

        <section class="calendar-container">
            <div class="calendar-header">
                <button id="prevMonth"><</button>
                <h2 id="currentMonthYear">Березень 2026</h2>
                <button id="nextMonth">></button>
            </div>
            <div id="calendarGrid" class="calendar-grid">
                <div class="day-header">Пн</div><div class="day-header">Вт</div>
                <div class="day-header">Ср</div><div class="day-header">Чт</div>
                <div class="day-header">Пт</div><div class="day-header">Сб</div>
                <div class="day-header">Нд</div>
                </div>
        </section>
    </main>

    <div id="eventModal" class="modal">
        <div class="modal-content">
            <h3>Нова подія</h3>
            <form id="eventForm">
                <input type="text" id="eventTitle" placeholder="Назва (мін. 3 символи)" required minlength="3" maxlength="100">
                <textarea id="eventDesc" placeholder="Опис"></textarea>
                <label>Початок:</label>
                <input type="datetime-local" id="startTime" required>
                <label>Кінець:</label>
                <input type="datetime-local" id="endTime">
                
                <label>Категорія:</label>
                <select id="categoryId">
                    <option value="1">Робота</option>
                    <option value="2">Навчання</option>
                </select>
                <button type="button" id="addCategoryBtn">Додати категорію</button>
                
                <div id="recurrenceSection" style="display: none;">
                    <label><input type="checkbox" id="isRecurring"> Повторювати подію</label>
                    <select id="recurrenceType" disabled>
                        <option value="1">Щодня</option>
                        <option value="2">Щотижня</option>
                        <option value="3">Щомісяця</option>
                        <option value="4">Щороку</option>
                    </select>
                    <label>Кінець повторення:</label>
                    <input type="date" id="recurrenceEndDate" disabled>
                </div>
                
                <div id="reminderSection">
                    <label><input type="checkbox" id="enableReminder" checked> Нагадування</label>
                    <select id="reminderType">
                        <option value="email">Email</option>
                        <option value="sms">SMS</option>
                        <option value="push">Push</option>
                    </select>
                    <select id="reminderMinutes">
                        <option value="5">5 хвилин</option>
                        <option value="15" selected>15 хвилин</option>
                        <option value="30">30 хвилин</option>
                        <option value="60">1 година</option>
                        <option value="1440">1 день</option>
                    </select>
                </div>
                
                <div class="modal-buttons">
                    <button type="submit" class="btn-save" aria-label="Зберегти подію">Зберегти</button>
                    <button type="button" class="btn-cancel" onclick="closeModal()">Скасувати</button>
                </div>
            </form>
        </div>
    </div>

    <div id="categoryModal" class="modal">
        <div class="modal-content">
            <h3>Нова категорія</h3>
            <form id="categoryForm">
                <input type="text" id="categoryName" placeholder="Назва категорії" required>
                <input type="color" id="categoryColor" value="#FF5733" required>
                <div class="modal-buttons">
                    <button type="submit" class="btn-save">Зберегти</button>
                    <button type="button" class="btn-cancel" onclick="closeCategoryModal()">Скасувати</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        // Replace 'Користувач' with the user's full name
        const userName = "Ім'я Користувача"; // Replace with dynamic user name variable
        document.getElementById('userName').textContent = userName;
    </script>
</body>
</html>
